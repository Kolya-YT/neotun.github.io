<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Войти — NeoTUN</title><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#070711"><link rel="icon" href="/img/favicon.png?v=20260921"><link rel="stylesheet" href="css/style.css"></head><body>
<nav class="navbar"><a class="navbar-brand" href="/">Neo<span>TUN</span></a><div style="margin-left:auto"><a href="/" class="btn btn-outline">← На главную</a></div></nav>
<main><div class="auth-page"><div class="auth-card" id="auth-card"><div class="auth-steps-bar"><div class="auth-steps-fill" id="auth-steps-fill"></div></div><div class="auth-steps-label" id="auth-steps-label">Шаг 1 из 3</div>
<div id="step-choose"><div class="auth-logo">Neo<span>TUN</span></div><h2>Войти в NeoTUN</h2><p class="auth-sub">Telegram или Email — выберите удобный способ</p>

</div></div></main><div id="toast" class="toast"></div><script src="js/main.js"></script><script src="js/auth.js"></script></body></html>
